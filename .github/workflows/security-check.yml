name: Security & syntax checks

# Self-contained: GitHub-hosted runner, no reusable workflow from another
# repository and no private registry, so it runs the same for anyone who
# forks the repo.
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  GITLEAKS_VERSION: "8.30.1"

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0 # gitleaks scans history, not just the working tree

      - name: Secret scan (gitleaks)
        # The gitleaks CLI rather than gitleaks/gitleaks-action, which needs a
        # license for organization repos.
        run: |
          curl -fsSL -o "$RUNNER_TEMP/gitleaks.tar.gz" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" detect --source . --redact -v

      - name: Leak check
        # Private names must not reach this public repo. The patterns are the
        # org secret LEAK_PATTERNS, which fork PRs do not get: they pass with a
        # notice, and the push to main after merge runs the full check.
        env:
          LEAK_PATTERNS: ${{ secrets.LEAK_PATTERNS }}
          ENFORCE: ${{ github.repository_owner == 'rackmarten' && !(github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork) }}
        run: |
          if [ -z "$LEAK_PATTERNS" ]; then
            if [ "$ENFORCE" = true ]; then
              echo "::error::LEAK_PATTERNS secret is not available"
              exit 1
            fi
            echo "::notice::LEAK_PATTERNS not available, leak check skipped"
            exit 0
          fi
          .github/scripts/leak-check.sh --tree --log

      - name: Bash syntax check
        run: git ls-files -z '*.sh' '*.bash' | xargs -0 -n1 bash -n

      - name: ShellCheck
        # --severity=warning skips info/style nits (e.g. SC1091 for a
        # dynamically sourced path) but still fails on correctness issues.
        run: git ls-files -z '*.sh' '*.bash' | xargs -0 shellcheck --severity=warning

      - name: yamllint
        run: |
          pipx install yamllint
          git ls-files -z '*.yml' '*.yaml' | xargs -0 yamllint -d relaxed

      - name: JSON syntax check
        run: |
          fail=0
          while IFS= read -r -d '' f; do
            jq empty "$f" || { echo "::error file=$f::Invalid JSON"; fail=1; }
          done < <(git ls-files -z '*.json')
          exit "$fail"

      - name: Validate docker-compose.yml
        run: docker compose config --quiet

      - name: hadolint
        run: |
          curl -fsSL -o "$RUNNER_TEMP/hadolint" \
            https://github.com/hadolint/hadolint/releases/latest/download/hadolint-Linux-x86_64
          chmod +x "$RUNNER_TEMP/hadolint"
          "$RUNNER_TEMP/hadolint" Dockerfile

  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Typecheck and tests
        working-directory: app
        run: |
          npm ci
          npm run typecheck
          npm test

  # The runner image builds from the public registry alone, no token.
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build the runner image
        run: docker compose build
